<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Дерево обещаний МАКС-Жизнь</title>
    <style>
      /* Фон и лоадер до приезда JS/CSS: белый экран исключён. Цвета — палитра index.css (@theme). */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #071219; }
      #root { height: 100%; }
      .boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #071219; color: #eaf4f2; font-family: "Golos Text", "Segoe UI", system-ui, sans-serif; }
      .boot-spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #17313d; border-top-color: #f2b45a; animation: boot-spin 0.8s linear infinite; }
      .boot-title { margin: 0; font-size: 15px; font-weight: 600; }
      .boot-sub { margin: 0; font-size: 12px; color: #93abb2; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader">
        <span class="boot-spinner"></span>
        <p class="boot-title">Дерево обещаний МАКС-Жизнь</p>
        <p class="boot-sub">Загрузка…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
